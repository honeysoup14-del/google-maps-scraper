services:
  google-maps-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - "-data-folder"
      - "/gmapsdata"
    volumes:
      - gmaps-data:/gmapsdata
    expose:
      - "8080"
    networks:
      - default
      - dokploy-network

volumes:
  gmaps-data:

networks:
  dokploy-network:
    external: true
